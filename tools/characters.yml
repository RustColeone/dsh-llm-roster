    name: Kimi
    sheet: https://蓝色大肥鱼.com/works/kimi202610170001.html
    image: https://raw.githubusercontent.com/lmy414/ai-girl-stickers/main/dist/submissions/originals/kimi/f6718d162fce6aa5.png
    look: >-
      long wavy silver-white hair, a white maid headdress, a hair ornament of a crescent moon and a rainbow triangle,
      a dark-blue night-sky shawl dress covered in stars, music staves and piano keys over a white frilled blouse, a
      silver flute with a rainbow stripe at her waist on a chain with a small K tag
    motif: the starry night sky, music notes and the flute
    role: the dreamy music-club flautist who plays under the stars
