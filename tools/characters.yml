# The characters this project draws itself (tools/draw-art.py), besides the five that come from ChimeraArchiveHarness
# (tools/import-art.py). Each is drawn from her standing art by ZipZipPipe, as kept in the AI-girl fan archive
# 蓝色大肥鱼.com (`sheet`, the works page; `image`, its original), in the same style and tiers as the others: the style,
# then the tier's own words, with `{name}`, `{look}`, `{motif}` and `{role}` filled in from her entry.
#
# `faces`: where her face is on each tier's card (centre x, centre y, side, on the 512 x 768 card), for her avatar;
# a tier left out uses `face_defaults`. Check a new drawing's crop (--faces-only redoes them without drawing).
model: gpt-image-2.5-sunburst
chibi_reference: https://raw.githubusercontent.com/lmy414/ai-girl-stickers/main/dist/submissions/originals/deepseek/c5bc5f353c0173d1.png
style: >-
  Japanese anime gacha-game character art of the girl in the reference picture: her standing art shows her whole look
  (hair, ears, horns, wings, tail, eyes, outfit colours and ornaments). Keep every feature that makes her her ({look})
  exactly as in it. Wholesome and modest: she is fully and neatly dressed, nothing revealing, no fan service. Clean
  lineart, soft cel shading, bright appealing colours, no text, no watermark, no logo.

tiers:
  chibi:
    size: 1024x1024
    quality: medium
    background: transparent
    chibi_reference: true
    prompt: >-
      A Q版 chibi of {name}, {role}, drawn exactly in the style of the chibi reference picture (the first one: copy its
      style and proportions only, not its character): about two heads tall, a big round head with huge glossy eyes, a
      tiny soft body, standing facing forward, in her own outfit from her standing art with her ears, horns, wings or
      tail as she has them, simple clean flat colours. Full body, on a transparent background with nothing else in the
      picture.
  middle:
    size: 1024x1536
    quality: medium
    prompt: >-
      {name} drawn as a middle-school girl: younger proportions, a sailor-style middle-school uniform, a slightly shy
      eager expression, a simple classroom background, waist-up.
  high:
    size: 1024x1536
    quality: medium
    prompt: >-
      {name} drawn as a high-school girl: a smart blazer uniform with a ribbon, a confident capable expression, a school
      hallway in soft light, waist-up.
  university:
    size: 1024x1536
    quality: medium
    prompt: >-
      {name} drawn as a university student: stylish grown-up casual clothes, a mature composed expression, books under
      her arm, a sunny campus courtyard, waist-up.

# The Original pack's pictures (`draw-art.py --original`), with the words and quality ChimeraArchiveHarness drew the
# first five's with (its extensions/students/art.yml): her stages, each a new, better illustration, more detailed at every
# stage; her bond pictures; her mood faces. They are kept in tools/.drawn/<name>/<kind>.png, and tools/original-pack.py
# makes the pack's cards and faces of them.
original:
  stage-2:
    size: 1024x1536
    quality: low
    prompt: >-
      Stage 2 card art of {name}, {role}: a waist-up portrait in her school uniform, a gentle confident expression,
      a simple soft pastel background with a hint of {motif}.
  stage-3:
    size: 1024x1536
    quality: medium
    prompt: >-
      Stage 3 card art of {name}, {role}: a detailed knee-up illustration in an evolved version of her uniform with
      touches of {motif}, a dynamic pose, a background that fits her place in the club, warm rim light and richer
      textures in hair and cloth.
  stage-4:
    size: 1024x1536
    quality: high
    prompt: >-
      Stage 4 awakened SSR splash art of {name}, {role}: a full-body, highly detailed illustration in an ornate,
      fully covering awakened outfit built on her motifs ({motif}): a long coat over a high-collared dress, gloves and
      boots. Flowing hair and coat tails, dramatic lighting, glowing particles, an elaborate detailed background, the
      finest detail of all her stages.
  # Bond: more casual and personal as she grows closer to you.
  bond-1:
    size: 1024x1536
    quality: medium
    prompt: >-
      A casual snapshot of {name} off duty: an everyday outfit (an oversized cardigan or hoodie), a relaxed natural
      smile, sitting at a café table with a drink, warm afternoon daylight, like a photo taken while hanging out.
  bond-2:
    size: 1024x1536
    quality: medium
    prompt: >-
      {name} at ease with someone she trusts: cosy at-home clothes, curled up on a sofa with a snack and a game
      controller, a playful teasing expression, soft evening lamp light, a lived-in room.
  bond-3:
    size: 1024x1536
    quality: medium
    prompt: >-
      A special memory with {name}: a summer-festival yukata with patterns of {motif}, fireworks in the night sky
      behind her, a bright happy blush, holding out her hand towards the viewer, sparkling and warm.
  # Her mood faces (happy, calm, worried, sad): round faces, shown small and cropped to a circle.
  mood-happy:
    size: 1024x1024
    quality: medium
    prompt: >-
      A round face icon of {name}: head and shoulders, her face centred and filling most of the square, beaming with
      a bright open smile, sparkling eyes and a light blush, on a soft plain pastel background of one colour (it is
      cropped to a circle).
  mood-calm:
    size: 1024x1024
    quality: medium
    prompt: >-
      A round face icon of {name}: head and shoulders, her face centred and filling most of the square, calm and at
      ease with a gentle small smile and soft relaxed eyes, on a soft plain pastel background of one colour (it is
      cropped to a circle).
  mood-worried:
    size: 1024x1024
    quality: medium
    prompt: >-
      A round face icon of {name}: head and shoulders, her face centred and filling most of the square, worried:
      knitted brows, a small uneasy frown, glancing aside, a little sweat drop, on a soft plain pastel background of
      one colour (it is cropped to a circle).
  mood-sad:
    size: 1024x1024
    quality: medium
    prompt: >-
      A round face icon of {name}: head and shoulders, her face centred and filling most of the square, sad: teary
      eyes, a trembling downturned mouth, her head lowered a little, on a soft plain pastel background of one colour
      (it is cropped to a circle).

face_defaults:
